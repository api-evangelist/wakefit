aid: wakefit
name: Wakefit
description: 'Wakefit Innovations Limited (wakefit.co) is an Indian direct-to-consumer
  home and sleep-solutions company founded in 2016 in Bengaluru, selling memory-foam
  and orthopaedic mattresses, beds, sofas, wardrobes, bedding, decor and the Wakefit
  Zense connected-sleep line (Regul8 mattress temperature controller and Track8
  contactless sleep tracker) through its own e-commerce storefront, an offline retail
  network and Indian marketplaces. Wakefit operates as a retailer rather than a
  platform: it publishes no public developer program, no API documentation and no
  machine-readable API contract, and its storefront back end at api.wakefit.co is a
  private, login-gated internal dashboard. This profile records the company identity
  and the public pages it does serve.'
